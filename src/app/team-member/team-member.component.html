<app-side-bar (sidebarToggled)="onSidebarToggled($event)"></app-side-bar>
<app-nav-bar></app-nav-bar>
<div class="main-content" [class.main-content-open]="isSidebarOpen">
  <div class="container my-5">
    <h2 class="text-center text-primary mb-5">Meet Our Team</h2>
  
    <!-- Add New Member Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0">Team Members</h4>
      <button type="button" class="btn btn-success" (click)="openModal(teamMembersNull)">
        <i class="bi bi-person-plus"></i> Add New Member
      </button>
    </div>
  
    <!-- Team Members Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <div *ngFor="let member of teamMembers" class="col">
        <div class="card shadow-sm h-100">
          <img
            *ngIf="member.user.image; else defaultImage"
            [src]="member.user.image"
            class="card-img-top"
            alt="{{ member.fullName }}"
          />
          <ng-template #defaultImage>
            <img
              src="https://cdn-icons-png.flaticon.com/512/10412/10412383.png"
              class="card-img-top"
              alt="Default Image"
            />
          </ng-template>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ member.fullName }}</h5>
            <p class="card-text">
              <strong>Role:</strong> {{ member.userType }}<br />
              <strong>Email:</strong> {{ member.user.email }}<br />
              <strong>Username:</strong> {{ member.user.username }}
            </p>
            <div class="mt-auto d-flex justify-content-between">
              <button (click)="openModal(member)" class="btn btn-outline-primary me-2">
                <i class="bi bi-eye"></i> View Profile
              </button>
              <button (click)="banMember(member.id!)" class="btn btn-outline-danger">
                <i class="bi bi-person-x"></i> Ban Member
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
